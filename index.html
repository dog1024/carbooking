<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b3f" />
    <meta
      name="description"
      content="记录司机出行日期、可载人数、剩余座位和联系方式的出行信息板。"
    />
    <title>顺风车出行板</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead__shade"></div>
      <div class="masthead__content page-shell">
        <div>
          <p class="eyebrow">CARPOOL BOARD</p>
          <h1>顺风车出行板</h1>
        </div>
        <div id="sync-status" class="storage-badge is-loading" title="正在连接共享数据库">
          <span class="storage-badge__dot" aria-hidden="true"></span>
          <span id="sync-status-text">正在连接</span>
        </div>
      </div>
    </header>

    <main class="page-shell workspace">
      <section id="setup-panel" class="setup-panel" aria-labelledby="setup-title" hidden>
        <div>
          <p class="section-kicker">需要配置</p>
          <h2 id="setup-title">连接共享数据库</h2>
          <p id="setup-message">在 config.js 中填写 Supabase 项目地址与公开密钥。</p>
        </div>
        <a class="secondary-button" href="README.md" target="_blank" rel="noopener">查看配置步骤</a>
      </section>

      <div id="legacy-notice" class="legacy-notice" hidden>
        <span id="legacy-message"></span>
        <button id="migrate-button" class="secondary-button" type="button">发布到共享列表</button>
      </div>

      <section class="entry-panel" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">新增记录</p>
            <h2 id="form-title">登记司机行程</h2>
          </div>
          <button class="text-button" id="reset-form" type="button">清空</button>
        </div>

        <form id="trip-form" novalidate>
          <div class="form-grid">
            <label class="field">
              <span>司机称呼</span>
              <input
                id="driver-name"
                name="driverName"
                type="text"
                maxlength="30"
                autocomplete="name"
                placeholder="例如：王师傅"
                required
              />
            </label>

            <label class="field field--wide">
              <span>出行日期与时间</span>
              <input id="travel-date" name="travelDate" type="datetime-local" required />
            </label>

            <label class="field">
              <span>出发地</span>
              <input
                id="origin"
                name="origin"
                type="text"
                maxlength="80"
                placeholder="例如：市民广场"
                required
              />
            </label>

            <label class="field">
              <span>终点</span>
              <input
                id="destination"
                name="destination"
                type="text"
                maxlength="80"
                placeholder="例如：高铁站"
                required
              />
            </label>

            <label class="field field--wide">
              <span>途经地点 <small>选填</small></span>
              <input
                id="waypoints"
                name="waypoints"
                type="text"
                maxlength="160"
                placeholder="多个地点可用逗号分隔"
              />
            </label>

            <label class="field">
              <span>可载人数</span>
              <input
                id="capacity"
                name="capacity"
                type="number"
                min="1"
                max="99"
                inputmode="numeric"
                placeholder="4"
                required
              />
            </label>

            <label class="field">
              <span>剩余可载人数</span>
              <input
                id="remaining-seats"
                name="remainingSeats"
                type="number"
                min="0"
                max="99"
                inputmode="numeric"
                placeholder="4"
                required
              />
            </label>

            <label class="field">
              <span>联系方式</span>
              <input
                id="contact"
                name="contact"
                type="text"
                maxlength="60"
                autocomplete="tel"
                placeholder="手机号或微信号"
                required
              />
            </label>

            <label class="field">
              <span>乘车费用 <small>元/人，0 表示免费</small></span>
              <input
                id="fare-amount"
                name="fareAmount"
                type="number"
                min="0"
                max="9999"
                step="0.01"
                inputmode="decimal"
                placeholder="例如：20"
                required
              />
            </label>

            <label class="field field--wide">
              <span>备注 <small>选填，最多 300 字</small></span>
              <textarea
                id="notes"
                name="notes"
                maxlength="300"
                rows="4"
                placeholder="例如：可携带行李、集合说明等"
              ></textarea>
            </label>
          </div>

          <div class="form-actions">
            <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
            <button id="submit-button" class="primary-button" type="submit">
              <span aria-hidden="true">＋</span>
              添加行程
            </button>
          </div>
        </form>
      </section>

      <section class="records-section" aria-labelledby="records-title">
        <div class="records-toolbar">
          <div>
            <p class="section-kicker">行程列表</p>
            <div class="records-title-row">
              <h2 id="records-title">司机出行信息</h2>
              <span id="record-count" class="record-count">0 条</span>
            </div>
          </div>

        </div>

        <div id="trip-list" class="trip-list" aria-live="polite"></div>

        <div id="empty-state" class="empty-state">
          <div class="empty-state__icon" aria-hidden="true">+</div>
          <h3 id="empty-title">正在连接</h3>
          <p id="empty-message">正在读取共享行程。</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="page-shell disclaimer" aria-labelledby="disclaimer-title">
        <div class="disclaimer__heading">
          <span class="disclaimer__mark" aria-hidden="true">i</span>
          <h2 id="disclaimer-title">免责声明</h2>
        </div>
        <div class="disclaimer__content">
          <p>
            本网站为非营利的出行信息共享工具，仅用于方便司机与乘客发布、查看和联系出行信息；网站不收取平台服务费，也不参与定价、交易、承运或行程安排。
          </p>
          <p>
            所有信息由用户自行发布，网站不对用户身份、车辆状况、信息真实性或行程安全作保证。联系和乘车前请自行核实信息、遵守当地法律法规，并注意人身、财产和隐私安全。
          </p>
        </div>
      </div>
    </footer>

    <template id="trip-card-template">
      <article class="trip-card">
        <div class="trip-card__topline">
          <div class="date-block">
            <span class="date-block__day"></span>
            <div>
              <p class="date-block__month"></p>
              <p class="date-block__time"></p>
            </div>
          </div>
          <div class="card-actions">
            <span class="ownership-label"></span>
            <span class="expiry-label"></span>
          </div>
        </div>

        <div class="trip-card__body">
          <div>
            <p class="card-label">司机</p>
            <h3 class="driver-name"></h3>
          </div>
          <div>
            <p class="card-label">联系方式</p>
            <a class="contact-value"></a>
          </div>
          <div>
            <p class="card-label">乘车费用</p>
            <p class="fare-value"></p>
          </div>
        </div>

        <div class="route-block" aria-label="行程路线">
          <div class="route-stop route-stop--origin">
            <span class="route-marker" aria-hidden="true"></span>
            <div>
              <p class="card-label">出发地</p>
              <p class="route-value origin-value"></p>
            </div>
          </div>
          <div class="route-stop route-stop--waypoints">
            <span class="route-marker" aria-hidden="true"></span>
            <div>
              <p class="card-label">途经</p>
              <p class="route-value waypoints-value"></p>
            </div>
          </div>
          <div class="route-stop route-stop--destination">
            <span class="route-marker" aria-hidden="true"></span>
            <div>
              <p class="card-label">终点</p>
              <p class="route-value destination-value"></p>
            </div>
          </div>
        </div>

        <div class="trip-notes" hidden>
          <p class="card-label">备注</p>
          <p class="notes-value"></p>
        </div>

        <div class="seat-control">
          <div>
            <p class="card-label">剩余座位</p>
            <p class="seat-summary"><strong class="remaining-value"></strong><span class="capacity-value"></span></p>
          </div>
          <div class="stepper" aria-label="调整剩余座位">
            <button class="stepper-button decrease-button" type="button" title="减少一个座位" aria-label="减少一个座位">−</button>
            <span class="stepper-value" aria-live="polite"></span>
            <button class="stepper-button increase-button" type="button" title="增加一个座位" aria-label="增加一个座位">＋</button>
          </div>
          <span class="read-only-label" hidden>仅发布者可调整</span>
        </div>
      </article>
    </template>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
